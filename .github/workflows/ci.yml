
name: Java CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]

  pull_request:
    branches: [ "develop", "main" ]

jobs:

  # ETAPA 1 - Build e testes
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e executar testes
        run: mvn clean verify

      # Relatorio JaCoCo
      - name: Salvar relatorio JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

      # Testes JUnit
      - name: Publicar resultados JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-junit
          path: target/surefire-reports/

      # Checkstyle
      - name: Verificar qualidade do codigo
        run: mvn checkstyle:check

      # SonarQube com Quality Gate
      - name: Analise SonarQube
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ETAPA 2 - Deploy
  deploy:
    runs-on: ubuntu-latest

    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Executar deploy
        run: |
          echo "Aprovacao recebida!"
          echo "Executando deploy..."
          # Adicione aqui o comando real de deploy
