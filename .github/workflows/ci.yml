
name: Java Secure CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]

  pull_request:
    branches: [ "develop", "main" ]

jobs:

  # JOB 1 - TESTES UNITARIOS
  unit-tests:
    name: Testes Unitarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Executar JUnit
        run: mvn -B test

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-unitarios
          path: target/surefire-reports/
          if-no-files-found: warn

  # JOB 2 - TESTES DE INTEGRACAO
  integration-tests:
    name: Testes de Integracao
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verificar Docker
        run: docker version

      - name: Executar Testcontainers
        run: mvn -B -Dskip.unit.tests=true verify

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-integracao
          path: target/failsafe-reports/
          if-no-files-found: warn

  # JOB 3 - SEGURANCA OWASP
  security-scan:
    name: Analise de Vulnerabilidades
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: OWASP Dependency Check
        run: >
          mvn -B
          org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=0.0
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Salvar relatorio OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp
          path: target/dependency-check-report.html
          if-no-files-found: warn

  # JOB 4 - COBERTURA
  coverage-gate:
    name: Verificar Cobertura JaCoCo
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Executar testes e validar cobertura
        run: mvn -B clean verify

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  # JOB 5 - DEPLOY
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests
      - security-scan
      - coverage-gate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Executar Deploy
        run: |
          echo "Todos os testes passaram!"
          echo "Cobertura minima aprovada!"
          echo "Analise OWASP aprovada!"
          echo "Deploy autorizado!"
          # Inserir comando real de deploy
